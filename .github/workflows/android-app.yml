# LEN0012: builds and signs the LensSpace Android app (Capacitor shell that loads
# https://lensspace.fullkod.com). Manual trigger only (decision D2): web changes reach installed apps
# with every Vercel deploy, so a new APK is only needed when the shell changes. Then run
# `node scripts/android-publish.mjs` locally: it uploads the APK to Supabase Storage and keeps only
# that version (D6). The only secrets are the signing key and its password (created with
# `node scripts/android-keystore.mjs --github`). Never add pull_request triggers: the repo is public.
name: Android app
run-name: "Android app ${{ inputs.version_name || format('1.0.{0}', github.run_number) }}"

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Versión visible (por defecto 1.0.<número de ejecución>)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::Missing secret ANDROID_KEYSTORE"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lensspace.jks"

      - name: Build and sign
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          LENSSPACE_KEYSTORE_FILE: ${{ runner.temp }}/lensspace.jks
          LENSSPACE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          args=(--version-code "$GITHUB_RUN_NUMBER" --assemble)
          [ -n "$VERSION_NAME" ] && args+=(--version-name "$VERSION_NAME")
          node scripts/android-build.mjs "${args[@]}"

      - name: Verify the signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs release/*.apk

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lensspace.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: lensspace-android
          path: release/
          retention-days: 30
          if-no-files-found: error
