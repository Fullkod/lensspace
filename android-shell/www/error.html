<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LensSpace</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f8f7; color: #07322f; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 420px; padding: 24px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #4b6563; line-height: 1.5; }
  a { display: inline-block; border-radius: 12px; padding: 12px 20px; background: #0d7a72; color: #fff; font-weight: 600; font-size: 15px; text-decoration: none; }
  small { display: block; margin-top: 28px; color: #8aa09e; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1 id="title">Sin conexión</h1>
  <p id="text">No hay señal para abrir LensSpace. Si es la primera vez que usas la app en este teléfono, ábrela una vez con señal: después podrás vender aunque se vaya la conexión.</p>
  <a id="retry" href="https://lensspace.fullkod.com/">Reintentar</a>
  <small id="diagnostic"></small>
</main>
<script>
  // LEN0012: Capacitor opens this page when the WebView is older than android.minWebViewVersion
  // (111, what Next 16 needs) or when the first load fails. Say which, so a screenshot is enough.
  (function () {
    var MIN_WEBVIEW = 111
    var match = navigator.userAgent.match(/Chrome\/(\d+)/)
    var webview = match ? Number(match[1]) : null
    var online = navigator.onLine
    if (webview && webview < MIN_WEBVIEW) {
      document.getElementById('title').textContent = 'Hay que actualizar el teléfono'
      document.getElementById('text').textContent = 'LensSpace necesita una versión más nueva de «Android System WebView» (este teléfono tiene la ' + webview + ' y hace falta la ' + MIN_WEBVIEW + ' o más). Actualízala desde la tienda de aplicaciones que uses o descárgala de un sitio de confianza, y vuelve a abrir LensSpace. Mientras tanto puedes usar LensSpace desde Chrome.'
      document.getElementById('retry').style.display = 'none'
    } else if (online) {
      document.getElementById('title').textContent = 'LensSpace no respondió'
      document.getElementById('text').textContent = 'Hay señal, pero LensSpace no cargó. Puede ser una conexión muy lenta. Inténtalo de nuevo.'
    }
    // MainActivity passes #reason=…&url=… (Android error code, HTTP status or SSL error).
    var hash = new URLSearchParams(location.hash.slice(1))
    var reason = hash.get('reason')
    var failed = hash.get('url')
    document.getElementById('diagnostic').textContent = 'WebView ' + (webview || '?') + ' · ' + (online ? 'con conexión' : 'sin conexión') + ' · ' + (navigator.userAgent.indexOf('LensSpaceAndroid') >= 0 ? 'app' : 'navegador') +
      (reason ? ' · ' + reason : '') + (failed ? ' · ' + failed : '')
    window.addEventListener('online', function () { if (!webview || webview >= MIN_WEBVIEW) location.href = 'https://lensspace.fullkod.com/' })
  })()
</script>
</body>
</html>
